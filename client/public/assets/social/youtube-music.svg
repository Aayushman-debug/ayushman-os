<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ytm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#28090d"/>
      <stop offset="100%" stop-color="#0b0812"/>
    </linearGradient>
    <radialGradient id="ytm-glow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#140608" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#ytm-bg)"/>
  <rect width="600" height="600" fill="url(#ytm-glow)"/>

  <!-- Soundwave Rings -->
  <g stroke="#f87171" stroke-opacity="0.16" fill="none">
    <circle cx="300" cy="250" r="185" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="300" cy="250" r="145" stroke-width="1"/>
  </g>

  <!-- YouTube Music Disc & Play Triangle -->
  <g transform="translate(300, 250)">
    <circle cx="0" cy="0" r="88" fill="#dc2626" stroke="#fca5a5" stroke-width="4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    <polygon points="-14,-22 24,0 -14,22" fill="#ffffff"/>
  </g>

  <rect x="150" y="380" width="300" height="44" rx="22" fill="#120507" fill-opacity="0.88" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="300" y="407" text-anchor="middle" fill="#fecaca" font-family="monospace" font-weight="800" font-size="16" letter-spacing="1.5">@wtfk1y0 · YT MUSIC</text>
</svg>
