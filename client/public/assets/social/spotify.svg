<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05130b"/>
      <stop offset="50%" stop-color="#092214"/>
      <stop offset="100%" stop-color="#060d09"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#05130b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sp-bg)"/>
  <rect width="600" height="600" fill="url(#sp-glow)"/>

  <!-- Vinyl Concentric Grooves -->
  <g stroke="#1db954" stroke-opacity="0.18" fill="none">
    <circle cx="300" cy="250" r="190" stroke-width="1.5"/>
    <circle cx="300" cy="250" r="158" stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="300" cy="250" r="126" stroke-width="1"/>
  </g>

  <!-- Spotify Emblem Circle & Acoustic Waves -->
  <g transform="translate(300, 250)">
    <circle cx="0" cy="0" r="86" fill="#07170e" stroke="#1db954" stroke-width="6"/>
    <path d="M-46,-20 C-16,-32 22,-29 48,-13" fill="none" stroke="#1ed760" stroke-width="10" stroke-linecap="round"/>
    <path d="M-38,4 C-12,-6 18,-3 40,10" fill="none" stroke="#1db954" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M-30,26 C-8,18 14,20 32,30" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect x="135" y="380" width="330" height="44" rx="22" fill="#040d08" fill-opacity="0.88" stroke="#1db954" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="300" y="407" text-anchor="middle" fill="#86efac" font-family="monospace" font-weight="800" font-size="15" letter-spacing="1.5">7 CURATED PLAYLISTS</text>
</svg>
