<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ma-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0806"/>
      <stop offset="50%" stop-color="#2e0f0b"/>
      <stop offset="100%" stop-color="#1c1204"/>
    </linearGradient>
    <linearGradient id="ma-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="ma-sun" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0806" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ma-bg)"/>
  <rect width="800" height="450" fill="url(#ma-sun)"/>

  <!-- Traditional Double-Line Madhubani Border with Geometric Triangles -->
  <rect x="28" y="24" width="744" height="402" rx="16" fill="none" stroke="url(#ma-gold)" stroke-width="3.5"/>
  <rect x="40" y="36" width="720" height="378" rx="12" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="50" y="46" width="700" height="358" rx="8" fill="none" stroke="#fde047" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Corner Folk Floral Rosettes -->
  <g stroke="#fde047" stroke-width="1.5" fill="#e11d48" fill-opacity="0.4">
    <circle cx="80" cy="76" r="18"/><circle cx="80" cy="76" r="8" fill="#f59e0b"/>
    <circle cx="720" cy="76" r="18"/><circle cx="720" cy="76" r="8" fill="#f59e0b"/>
    <circle cx="80" cy="374" r="18"/><circle cx="80" cy="374" r="8" fill="#f59e0b"/>
    <circle cx="720" cy="374" r="18"/><circle cx="720" cy="374" r="8" fill="#f59e0b"/>
  </g>

  <!-- Left & Right Art Gallery Showcase Cards -->
  <g transform="translate(82, 110)">
    <rect x="0" y="0" width="145" height="175" rx="12" fill="#270e0a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="72" cy="68" r="38" fill="#9f1239" stroke="#fde047" stroke-width="2"/>
    <path d="M52,68 Q72,38 92,68 Q72,98 52,68 Z" fill="#f59e0b"/>
    <text x="72" y="132" text-anchor="middle" fill="#fef08a" font-family="serif" font-weight="700" font-size="12">Kohbar Motif</text>
    <text x="72" y="150" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="10">Natural Pigment</text>
  </g>

  <g transform="translate(573, 110)">
    <rect x="0" y="0" width="145" height="175" rx="12" fill="#270e0a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="72" cy="68" r="38" fill="#065f46" stroke="#fde047" stroke-width="2"/>
    <polygon points="72,36 98,84 46,84" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <text x="72" y="132" text-anchor="middle" fill="#fef08a" font-family="serif" font-weight="700" font-size="12">Mayur Kachni</text>
    <text x="72" y="150" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">Handcrafted Line</text>
  </g>

  <!-- Central Sacred Ashtadala Lotus Mandala -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="112" fill="#2d0c09" stroke="url(#ma-gold)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 4"/>
    <!-- 8 Lotus Petals -->
    <g stroke="#fef08a" stroke-width="2" fill="#e11d48" fill-opacity="0.65">
      <ellipse cx="0" cy="-54" rx="22" ry="44"/>
      <ellipse cx="0" cy="54" rx="22" ry="44"/>
      <ellipse cx="-54" cy="0" rx="44" ry="22"/>
      <ellipse cx="54" cy="0" rx="44" ry="22"/>
      <ellipse cx="0" cy="-54" rx="20" ry="40" transform="rotate(45)" fill="#d97706" fill-opacity="0.7"/>
      <ellipse cx="0" cy="54" rx="20" ry="40" transform="rotate(45)" fill="#d97706" fill-opacity="0.7"/>
      <ellipse cx="-54" cy="0" rx="40" ry="20" transform="rotate(45)" fill="#d97706" fill-opacity="0.7"/>
      <ellipse cx="54" cy="0" rx="40" ry="20" transform="rotate(45)" fill="#d97706" fill-opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="32" fill="#451a03" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Title Plaque -->
  <rect x="200" y="324" width="400" height="62" rx="14" fill="#180806" stroke="url(#ma-gold)" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" fill="#fef08a" font-family="serif" font-weight="900" font-size="24" letter-spacing="3">MITHILA ART HERITAGE</text>
  <text x="400" y="374" text-anchor="middle" fill="#fda4af" font-family="monospace" font-weight="700" font-size="11" letter-spacing="2">MADHUBANI CULTURAL GALLERY &amp; ARTISAN PLATFORM</text>
</svg>
