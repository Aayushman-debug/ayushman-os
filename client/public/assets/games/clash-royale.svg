<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="50%" stop-color="#0f2557"/>
      <stop offset="100%" stop-color="#1e1136"/>
    </linearGradient>
    <linearGradient id="cr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cr-elixir" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="cr-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#071126" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cr-bg)"/>
  <rect width="800" height="450" fill="url(#cr-glow)"/>
  
  <!-- Arena Grid & River -->
  <g stroke="#3b82f6" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="225" x2="800" y2="225" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="290" x2="800" y2="290"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Twin Arena Bridges -->
  <rect x="175" y="205" width="50" height="40" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="575" y="205" width="50" height="40" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Left & Right Battle Banners -->
  <path d="M90,40 L170,40 L170,130 L130,155 L90,130 Z" fill="#1d4ed8" fill-opacity="0.5" stroke="#60a5fa" stroke-width="2"/>
  <path d="M630,40 L710,40 L710,130 L670,155 L630,130 Z" fill="#b91c1c" fill-opacity="0.5" stroke="#f87171" stroke-width="2"/>

  <!-- Central Royal Crown & Trophy Shield -->
  <g transform="translate(400, 195)">
    <polygon points="0,-115 95,-65 75,65 0,115 -75,65 -95,-65" fill="#0f172a" stroke="url(#cr-gold)" stroke-width="4"/>
    <polygon points="0,-102 82,-57 65,55 0,100 -65,55 -82,-57" fill="#1e3a8a" fill-opacity="0.55" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Royal Crown -->
    <path d="M-55,15 L-68,-42 L-28,-12 L0,-56 L28,-12 L68,-42 L55,15 Z" fill="url(#cr-gold)" stroke="#fef08a" stroke-width="2"/>
    <rect x="-55" y="20" width="110" height="16" rx="4" fill="url(#cr-gold)"/>
    <circle cx="-68" cy="-46" r="6" fill="#fef08a"/>
    <circle cx="0" cy="-62" r="8" fill="#38bdf8" stroke="#fef08a" stroke-width="2"/>
    <circle cx="68" cy="-46" r="6" fill="#fef08a"/>
    <circle cx="-30" cy="28" r="4" fill="#ef4444"/>
    <circle cx="0" cy="28" r="4" fill="#3b82f6"/>
    <circle cx="30" cy="28" r="4" fill="#ef4444"/>
    <text x="0" y="68" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="900" font-size="20" letter-spacing="2">10,200</text>
  </g>

  <!-- Elixir Drop Accent -->
  <g transform="translate(130, 95)">
    <path d="M0,-22 C12,-5 18,5 18,14 A18,18 0 1,1 -18,14 C-18,5 -12,-5 0,-22 Z" fill="url(#cr-elixir)" stroke="#fbcfe8" stroke-width="1.5"/>
  </g>
  <g transform="translate(670, 95)">
    <path d="M0,-22 C12,-5 18,5 18,14 A18,18 0 1,1 -18,14 C-18,5 -12,-5 0,-22 Z" fill="url(#cr-elixir)" stroke="#fbcfe8" stroke-width="1.5"/>
  </g>

  <!-- Bottom Arena Plate -->
  <text x="400" y="365" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="6">SUPERCELL · ARENA LEGENDARY</text>
</svg>
