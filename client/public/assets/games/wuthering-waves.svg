<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ww-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#131129"/>
      <stop offset="100%" stop-color="#081c29"/>
    </linearGradient>
    <linearGradient id="ww-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="ww-glow" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ww-bg)"/>
  <rect width="800" height="450" fill="url(#ww-glow)"/>

  <!-- Acoustic Soundwave & Tacet Mark Resonance Lines -->
  <g fill="none" stroke="url(#ww-wave)" stroke-width="2.5" opacity="0.75">
    <path d="M40,190 Q155,75 270,190 T500,190 T760,190"/>
    <path d="M40,190 Q155,305 270,190 T500,190 T760,190" opacity="0.5"/>
    <path d="M80,190 Q190,130 300,190 T520,190 T720,190" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="190" x2="720" y2="190" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- Frequency Spectrum Bars -->
  <g fill="#38bdf8" fill-opacity="0.45">
    <rect x="110" y="160" width="4" height="60" rx="2"/>
    <rect x="122" y="142" width="4" height="96" rx="2"/>
    <rect x="134" y="170" width="4" height="40" rx="2"/>
    <rect x="662" y="170" width="4" height="40" rx="2"/>
    <rect x="674" y="142" width="4" height="96" rx="2"/>
    <rect x="686" y="160" width="4" height="60" rx="2"/>
  </g>

  <!-- Central Tacet Mark Star Emblem -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="96" fill="#090b14" stroke="#a855f7" stroke-width="3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M0,-82 L12,-14 L82,0 L12,14 L0,82 L-12,14 L-82,0 L-12,-14 Z" fill="url(#ww-wave)"/>
    <path d="M-42,0 L42,0 M0,-42 L0,42" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>

  <!-- Telemetry Badges -->
  <g font-family="monospace" font-size="11" font-weight="700">
    <rect x="68" y="55" width="150" height="34" rx="8" fill="#090b14" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="143" y="76" text-anchor="middle" fill="#e9d5ff">TACET DISCORD</text>
    <rect x="582" y="55" width="150" height="34" rx="8" fill="#090b14" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="657" y="76" text-anchor="middle" fill="#bae6fd">SOLARIS-3 ROVER</text>
  </g>

  <text x="400" y="365" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="5">WUTHERING WAVES · KURO GAMES SOLARIS-3</text>
</svg>
