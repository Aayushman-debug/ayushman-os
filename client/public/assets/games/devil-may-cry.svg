<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dmc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09060a"/>
      <stop offset="50%" stop-color="#220710"/>
      <stop offset="100%" stop-color="#071124"/>
    </linearGradient>
    <linearGradient id="dmc-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="dmc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dmc-bg)"/>

  <!-- Judgement Cut Slash Lines (Vergil & Dante Duality) -->
  <g stroke-width="2" opacity="0.45">
    <line x1="90" y1="60" x2="710" y2="330" stroke="#38bdf8"/>
    <line x1="710" y1="55" x2="90" y2="335" stroke="#ef4444"/>
    <line x1="210" y1="20" x2="590" y2="370" stroke="#a855f7" stroke-dasharray="10 6"/>
  </g>

  <!-- Central Crossed Blades (Rebellion & Yamato) + SSS Rank Crest -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="95" fill="#0d0712" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="12 6"/>
    <!-- Crossed Swords -->
    <path d="M-75,65 L75,-65" stroke="url(#dmc-red)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-75,-65 L75,65" stroke="url(#dmc-blue)" stroke-width="6" stroke-linecap="round"/>
    <!-- SSS Style Badge -->
    <rect x="-58" y="-28" width="116" height="56" rx="10" fill="#09060d" stroke="#f87171" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" fill="#fca5a5" font-family="serif" font-style="italic" font-weight="900" font-size="34" letter-spacing="3">SSS</text>
  </g>

  <text x="400" y="362" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="5">DEVIL MAY CRY · CAPCOM STYLISH ACTION</text>
</svg>
