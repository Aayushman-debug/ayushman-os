<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chess-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07120e"/>
      <stop offset="50%" stop-color="#0d261c"/>
      <stop offset="100%" stop-color="#091520"/>
    </linearGradient>
    <linearGradient id="chess-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81b64c"/>
      <stop offset="100%" stop-color="#4e7828"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#chess-bg)"/>

  <!-- Perspective Chessboard Squares -->
  <g opacity="0.22">
    <rect x="120" y="40" width="70" height="70" fill="#81b64c"/>
    <rect x="260" y="40" width="70" height="70" fill="#81b64c"/>
    <rect x="400" y="40" width="70" height="70" fill="#81b64c"/>
    <rect x="540" y="40" width="70" height="70" fill="#81b64c"/>
    <rect x="190" y="110" width="70" height="70" fill="#81b64c"/>
    <rect x="330" y="110" width="70" height="70" fill="#81b64c"/>
    <rect x="470" y="110" width="70" height="70" fill="#81b64c"/>
    <rect x="610" y="110" width="70" height="70" fill="#81b64c"/>
    <rect x="120" y="180" width="70" height="70" fill="#81b64c"/>
    <rect x="260" y="180" width="70" height="70" fill="#81b64c"/>
    <rect x="400" y="180" width="70" height="70" fill="#81b64c"/>
    <rect x="540" y="180" width="70" height="70" fill="#81b64c"/>
    <rect x="190" y="250" width="70" height="70" fill="#81b64c"/>
    <rect x="330" y="250" width="70" height="70" fill="#81b64c"/>
    <rect x="470" y="250" width="70" height="70" fill="#81b64c"/>
    <rect x="610" y="250" width="70" height="70" fill="#81b64c"/>
  </g>

  <!-- Rating Trajectory Line -->
  <polyline points="80,290 190,260 310,220 440,165 580,120 710,85" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Central Chess.com Pawn & Grandmaster Knight Crest -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="96" fill="#0a1612" stroke="#81b64c" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Classic Chess Pawn Silhouette -->
    <circle cx="0" cy="-42" r="24" fill="url(#chess-green)" stroke="#bef264" stroke-width="2"/>
    <path d="M-22,-16 L22,-16 C16,6 28,28 36,44 L-36,44 C-28,28 -16,6 -22,-16 Z" fill="url(#chess-green)" stroke="#bef264" stroke-width="2"/>
    <rect x="-44" y="48" width="88" height="14" rx="5" fill="#bef264"/>
  </g>

  <!-- Live Rating Pills -->
  <g font-family="monospace" font-weight="800" font-size="13">
    <rect x="75" y="65" width="155" height="36" rx="8" fill="#060d0a" stroke="#81b64c" stroke-width="1.5"/>
    <text x="152" y="88" text-anchor="middle" fill="#bef264">BULLET: 2100</text>

    <rect x="75" y="112" width="155" height="36" rx="8" fill="#060d0a" stroke="#34d399" stroke-width="1.5"/>
    <text x="152" y="135" text-anchor="middle" fill="#6ee7b7">BLITZ: 2053</text>

    <rect x="570" y="65" width="155" height="36" rx="8" fill="#060d0a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="647" y="88" text-anchor="middle" fill="#7dd3fc">RAPID: 2035</text>
  </g>

  <text x="400" y="362" text-anchor="middle" fill="#a3e635" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="5">CHESS.COM · NERFEDAYUSHHHMAN</text>
</svg>
