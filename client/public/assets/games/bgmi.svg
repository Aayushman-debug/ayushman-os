<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgmi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="55%" stop-color="#1c1408"/>
      <stop offset="100%" stop-color="#2e1605"/>
    </linearGradient>
    <linearGradient id="bgmi-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="bgmi-flare" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgmi-bg)"/>
  <rect width="800" height="450" fill="url(#bgmi-flare)"/>

  <!-- Tactical Map Topographic Grid & Zone Circle -->
  <g stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1" fill="none">
    <circle cx="400" cy="200" r="170" stroke-dasharray="8 6" stroke-opacity="0.3"/>
    <circle cx="400" cy="200" r="125" stroke="#38bdf8" stroke-opacity="0.25"/>
    <line x1="400" y1="10" x2="400" y2="390"/>
    <line x1="150" y1="200" x2="650" y2="200"/>
    <rect x="60" y="35" width="680" height="350" rx="12" stroke-opacity="0.18"/>
  </g>

  <!-- Iconic Level 3 Spetsnaz Helmet Silhouette & Visor -->
  <g transform="translate(400, 195)">
    <!-- Outer Helmet Dome -->
    <path d="M-88,10 C-92,-65 -55,-105 0,-105 C55,-105 92,-65 88,10 L94,55 C94,75 65,92 0,92 C-65,92 -94,75 -94,55 Z" fill="#171923" stroke="url(#bgmi-amber)" stroke-width="3.5"/>
    <!-- Helmet Ridge -->
    <path d="M-72,-35 C-50,-75 50,-75 72,-35" fill="none" stroke="#475569" stroke-width="3"/>
    <!-- Armored Face Shield -->
    <rect x="-76" y="-22" width="152" height="68" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Glowing Tactical Slit Visor -->
    <rect x="-60" y="-6" width="120" height="24" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <line x1="-48" y1="6" x2="48" y2="6" stroke="#fde047" stroke-width="3"/>
    <line x1="-30" y1="-6" x2="-30" y2="18" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="18" stroke="#f59e0b" stroke-width="2"/>
    <line x1="30" y1="-6" x2="30" y2="18" stroke="#f59e0b" stroke-width="2"/>
    <!-- Rivets -->
    <circle cx="-64" cy="-12" r="3" fill="#fbbf24"/>
    <circle cx="64" cy="-12" r="3" fill="#fbbf24"/>
    <circle cx="-64" cy="34" r="3" fill="#fbbf24"/>
    <circle cx="64" cy="34" r="3" fill="#fbbf24"/>
    <!-- Mouth Vent Guard -->
    <rect x="-32" y="54" width="64" height="18" rx="4" fill="#090d16" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Left & Right HUD Telemetry -->
  <g fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">
    <text x="85" y="70">UID: 55528652768</text>
    <text x="85" y="90" fill="#94a3b8">CLAN: HOMIES</text>
    <text x="715" y="70" text-anchor="end">KD RATIO: 5.63</text>
    <text x="715" y="90" text-anchor="end" fill="#38bdf8">INDIA · ERANGEL</text>
  </g>

  <text x="400" y="362" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="5">BATTLEGROUNDS MOBILE INDIA · KRAFTON</text>
</svg>
