<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060813" />
      <stop offset="50%" stop-color="#131024" />
      <stop offset="100%" stop-color="#080b18" />
    </linearGradient>
    <radialGradient id="amberHalo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060813" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#vaultBg)" />
  <rect width="800" height="500" fill="url(#amberHalo)" />

  <!-- Subtle Timeline Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="250" x2="720" y2="250" stroke="#fbbf24" stroke-opacity="0.25" stroke-dasharray="6 6" />
    <line x1="200" y1="60" x2="200" y2="440" />
    <line x1="400" y1="60" x2="400" y2="440" />
    <line x1="600" y1="60" x2="600" y2="440" />
  </g>

  <!-- Central Archive Vault Emblem -->
  <circle cx="400" cy="230" r="118" fill="#0b0f20" stroke="url(#goldRing)" stroke-width="2.5" stroke-opacity="0.7" />
  <circle cx="400" cy="230" r="92" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="10 6" stroke-opacity="0.5" />
  <circle cx="400" cy="230" r="64" fill="#131832" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Keyhole / Archive Core -->
  <circle cx="400" cy="218" r="14" fill="url(#goldRing)" />
  <path d="M393 226 L407 226 L411 254 L389 254 Z" fill="url(#goldRing)" />

  <!-- Left Milestone Card -->
  <rect x="64" y="100" width="210" height="106" rx="16" fill="#0d1326" stroke="#fbbf24" stroke-opacity="0.35" />
  <text x="84" y="130" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">MILESTONE · 2024</text>
  <text x="84" y="158" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">B.Tech CSE · RTU</text>
  <text x="84" y="182" fill="#94a3b8" font-family="monospace" font-size="12">Roll No: 24EARCS003</text>

  <!-- Right Milestone Card -->
  <rect x="526" y="100" width="210" height="106" rx="16" fill="#0d1326" stroke="#c084fc" stroke-opacity="0.35" />
  <text x="546" y="130" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ACADEMIC PEAK</text>
  <text x="546" y="158" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">8.60 SGPA · Sem IV</text>
  <text x="546" y="182" fill="#94a3b8" font-family="monospace" font-size="12">8.46 Cumulative CGPA</text>

  <!-- Bottom Archive Banner -->
  <rect x="170" y="382" width="460" height="64" rx="16" fill="#0b1022" stroke="#fde68a" stroke-opacity="0.3" />
  <text x="400" y="410" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">AYushMan · PERSONAL MEMORIES &amp; VAULT</text>
  <text x="400" y="432" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">CORE PRINCIPLES · TIMELINE CAPSULES · FUTURE ROADMAP</text>
</svg>
